name: ci

on:
  push:
    branches: [main]
  pull_request:
  # weekly run so a dependency release that breaks the suite shows up
  # without waiting for the next push (Sundays 12:17 UTC)
  schedule:
    - cron: "17 12 * * 0"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # one leg failing must not cancel the other: on 2026-11-08 the 3.9 leg
      # could not install its interpreter and took the 3.12 leg down with it,
      # so a runner problem read as a red suite.
      fail-fast: false
      matrix:
        include:
          # 3.9 is the floor pyproject declares. GitHub builds no CPython 3.9
          # for the ubuntu-26.04 image that ubuntu-latest is moving to, so this
          # leg stays on 24.04, the newest image that still has one.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # tests need only numpy + pytest; matplotlib is experiments-only.
      # mypy is added for the type-check step below (numpy ships its own stubs).
      - run: pip install -e . pytest "mypy>=1.8"
      - run: pytest -q
      # Static type check of the public package. Run only on 3.12: the mypy
      # step consumes numpy's bundled stubs, which now use 3.12-only syntax.
      - name: type check (mypy)
        if: matrix.python-version == '3.12'
        run: mypy
